<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="32"
  height="32"
>
  <!-- Black circular background -->
  <circle
    cx="16"
    cy="16"
    r="16"
    fill="#000000"
  />

  <!-- Outer circle (extra-thin white outline) -->
  <circle
    cx="16"
    cy="16"
    r="13"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.25"
  />

  <!-- Central diamond -->
  <polygon
    points="16,7 25,16 16,25 7,16"
    fill="#FFFFFF"
  />
</svg>